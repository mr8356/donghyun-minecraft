# =====================================================================
#  Metrics: mc-monitor를 별도 exporter로 띄워 두 서버를 핑 -> /metrics 노출
#  Prometheus(kube-prometheus-stack)가 ServiceMonitor로 스크랩.
#  뽑히는 주요 지표: mc_status_healthy, mc_status_players_online, mc_status_response_time_ms
# =====================================================================
---
# Grafana sidecar가 이 ConfigMap을 자동 감지해 Loki 데이터소스를 등록함
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki.minecraft.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
---
# Grafana sidecar가 이 ConfigMap을 자동 감지해 대시보드를 프로비저닝함
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  minecraft-logs-dashboard.json: |
    {
      "title": "Minecraft - Logs & Activity",
      "uid": "minecraft-logs",
      "schemaVersion": 39,
      "version": 3,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "Server",
            "type": "custom",
            "query": "Bedrock : bedrock",
            "current": { "text": "Bedrock", "value": "bedrock" },
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Online Players",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [ { "color": "green", "value": null } ] } } },
          "targets": [
            { "expr": "sum(mc_status_players_online)", "legendFormat": "online" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Server Healthy",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus" },
          "options": { "colorMode": "background" },
          "fieldConfig": { "defaults": { "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ] } },
          "targets": [
            { "expr": "min(mc_status_healthy)", "legendFormat": "healthy" }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Response Time",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 300 } ] }
            }
          },
          "targets": [
            { "expr": "mc_status_response_time_ms", "legendFormat": "latency" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Log Volume by Level",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "loki" },
          "targets": [
            { "expr": "sum by (level) (count_over_time({namespace=\"minecraft\", app=~\"$app\"} [1m]))", "legendFormat": "{{level}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Player Join / Leave",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "loki" },
          "targets": [
            { "expr": "sum(count_over_time({namespace=\"minecraft\", app=~\"$app\"} |~ \"Player connected:\" [5m]))", "legendFormat": "join" },
            { "expr": "sum(count_over_time({namespace=\"minecraft\", app=~\"$app\"} |~ \"Player disconnected:\" [5m]))", "legendFormat": "leave" }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Errors & Warnings",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            { "expr": "{namespace=\"minecraft\", app=~\"$app\"} |~ \"WARN|ERROR\"" }
          ]
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Live Server Log",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 11 },
          "datasource": { "type": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [
            { "expr": "{namespace=\"minecraft\", app=~\"$app\"}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-monitor
  labels: { app: mc-monitor }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mc-monitor }
  template:
    metadata:
      labels: { app: mc-monitor }
    spec:
      containers:
        - name: exporter
          image: itzg/mc-monitor
          args:
            - "export-for-prometheus"
            - "--bedrock-servers"
            - "bedrock-headless.minecraft.svc.cluster.local:19132"
          ports:
            - { name: metrics, containerPort: 8080 }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mc-monitor
  labels: { app: mc-monitor }
spec:
  selector: { app: mc-monitor }
  ports:
    - { name: metrics, port: 8080, targetPort: 8080 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mc-monitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: mc-monitor }
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minecraft-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: minecraft.rules
      rules:
        - alert: MinecraftServerDown
          expr: mc_status_healthy == 0
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "Minecraft 서버 다운: {{ $labels.host }}"
        - alert: MinecraftPodOOMRestart
          expr: increase(kube_pod_container_status_restarts_total{namespace="minecraft"}[15m]) > 0
          for: 0m
          labels: { severity: warning }
          annotations:
            summary: "Minecraft 파드 재시작/OOM 감지: {{ $labels.pod }}"
